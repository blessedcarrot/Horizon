name: Daily Horizon Summary

on:
  schedule:
    # Once daily at 21:07 UTC = 06:07 in Tokyo, so the edition is waiting
    # at the start of the owner's day. Off-the-hour to dodge the scheduler pile-up.
    - cron: '7 21 * * *'
  workflow_dispatch:       # allow manual trigger from the Actions tab

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        # v7 is the highest floating major tag astral-sh publishes; v10 exists
        # only as pinned releases. v7 is node24, which clears the deprecation.
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: |
          set -o pipefail
          # 26h window on a daily cadence: 2h of deliberate overlap. Windows that
          # exactly abut the run interval leave a permanent gap — an item whose
          # feed lags its own timestamp (CDN caching) misses the run it belongs
          # to, and the next run's window starts after it. Seen with a Verge
          # item on 2026-08-16. Overlap costs a few re-scored items.
          uv run horizon --hours 26 2>&1 | tee horizon-run.log

      - name: "Run health check (BACKLOG #5/#6 - distinguish quiet from broken)"
        run: python scripts/check_run_health.py horizon-run.log --append-digest docs/_posts

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # keep existing summaries on gh-pages branch
          commit_message: "📝 Radar update: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true

      # After the deploy so the link in the message actually resolves.
      # always() so a run that died earlier still notifies.
      - name: Notify via Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_telegram.py --always

      # Runs AFTER deploy so a broken run still publishes its digest;
      # the red X on the run is the "go read the log" signal.
      - name: Fail job if items errored during the run
        run: |
          ERRS=$(cat health_errors.txt 2>/dev/null || echo 0)
          if [ "$ERRS" -gt 0 ]; then
            echo "::error::$ERRS ERROR line(s) during Horizon run — digest may be silently incomplete. See health report in step summary."
            exit 1
          fi
