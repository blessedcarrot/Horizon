name: Daily Horizon Summary

on:
  schedule:
    - cron: '7 */12 * * *'  # every 12 hours (UTC) — off-the-hour to avoid the scheduler pile-up
  workflow_dispatch:       # allow manual trigger from the Actions tab

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: uv run horizon --hours 12

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # keep existing summaries on gh-pages branch
          commit_message: "📝 Radar update: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
