theme: jekyll-theme-cayman
title: NEWS-Radar
description: "Early warning on AI and agentic AI — curated by Bruno Coelho"
baseurl: "/Horizon" # the subpath of your site, e.g. /blog
url: "https://blessedcarrot.github.io" # the base hostname & protocol for your site, e.g. http://example.com

# Build settings
markdown: kramdown
future: true # Allow future posts to be published
plugins:
  - jekyll-feed
feed:
  path: feed.xml
exclude:
  - ".github"
  - "node_modules"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
